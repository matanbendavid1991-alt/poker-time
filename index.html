<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>העיגול - Poker OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght=600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffcc00; --danger: #ff3b30; --success: #34c759; --royal-blue: #1a3a6c; --dark-blue: #0d1b31; }
        * { box-sizing: border-box; }
        body { 
            margin: 0; background-color: black; color: white;
            font-family: -apple-system, system-ui, sans-serif;
            height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; user-select: none;
        }

        #toastContainer { position: fixed; top: 25px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 12px; z-index: 999999; pointer-events: none; }
        .toast { background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--gold); color: white; padding: 14px 28px; border-radius: 40px; font-weight: bold; font-size: 1.1em; box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: toastEnter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; direction: rtl; text-align: center; }
        @keyframes toastEnter { from { opacity: 0; transform: translateY(-30px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastExit { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-30px) scale(0.9); } }

        #progressBar { position: absolute; top: 0; left: 0; height: 4px; background: var(--gold); box-shadow: 0 0 10px var(--gold); width: 100%; transition: width 1s linear; z-index: 1000; }
        #splashScreen { position: fixed; inset: 0; background: black; z-index: 100000; display: flex; justify-content: center; align-items: center; transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
        #splashLogo { width: 280px; height: 280px; background-image: url('logo.png'); background-size: contain; background-repeat: no-repeat; background-position: center; opacity: 0; transform: scale(0.85); animation: splashEntrance 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes splashEntrance { 0% { opacity: 0; transform: scale(0.85); } 100% { opacity: 1; transform: scale(1); } }
        
        #setupScreen { position: fixed; inset: 0; background: black; z-index: 9999; display: flex; justify-content: center; align-items: center; overflow-y: auto; padding: 20px 0; transition: opacity 0.5s ease; }
        .setup-card, #rebuyModal, #endGameModal, #settingsModal, #addPlayerModal, #aboutModal { background: rgba(26, 26, 26, 0.65); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 204, 0, 0.4); box-shadow: 0 15px 50px rgba(0,0,0,0.8); padding: 30px; border-radius: 35px; text-align: center; width: 400px; max-height: 95vh; overflow-y: auto; }
        .setup-card input, .modal-input { background: rgba(0, 0, 0, 0.5); border: 1px solid transparent; color: white; padding: 14px; border-radius: 15px; width: 80%; text-align: center; font-size: 1.3em; margin: 8px 0; transition: all 0.3s ease; }
        .setup-card input:focus, .modal-input:focus { border: 1px solid var(--gold); box-shadow: 0 0 15px rgba(255, 204, 0, 0.3); outline: none; }
        .setup-card .num-input { width: 85px; font-size: 1.8em; }
        
        .friends-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; max-height: 35vh; overflow-y: auto; padding: 10px; }
        .friend-circle { aspect-ratio: 1; background: #262626; border: 2px solid #444; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; font-size: 1.1em; color: #ccc; cursor: pointer; position: relative; transition: all 0.2s ease; }
        .friend-circle.selected { border-color: var(--gold); background: rgba(51, 42, 0, 0.8); color: white; box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }
        .friend-circle .v-badge { position: absolute; top: -2px; right: -2px; background: var(--gold); color: black; width: 22px; height: 22px; border-radius: 50%; font-size: 0.8em; display: flex; justify-content: center; align-items: center; display: none; }
        .friend-circle.selected .v-badge { display: flex; }

        .slider-wrapper { display: flex; width: 200vw; height: 100vh; transition: transform 0.5s cubic-bezier(0.15, 0.3, 0.25, 1); display: none; }
        .page { width: 100vw; height: 100vh; position: relative; overflow: hidden; flex-shrink: 0; }

        .admin-header { position: absolute; top: 15px; width: 100%; padding: 0 5%; display: flex; justify-content: space-between; align-items: center; z-index: 30; }
        .game-clock { font-size: 2.2vw; font-family: 'Rajdhani', monospace; color: var(--gold); font-weight: bold; text-shadow: 0 0 10px rgba(255,204,0,0.5); background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 8px 22px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 15px rgba(0,0,0,0.4); }

        .blind-info { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 6px 18px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 15px rgba(0,0,0,0.4); min-width: 140px; }
        .blind-arrow-btn { background: none; border: none; color: var(--gold); cursor: pointer; padding: 4px; font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; }
        .blind-arrow-btn:active { transform: scale(1.3); }
        
        .logo-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; text-align: center; }
        .app-logo { width: 240px; height: 240px; background-image: url('logo.png'); background-size: contain; background-repeat: no-repeat; background-position: center; }

        .timer { position: absolute; display: flex; justify-content: center; align-items: center; font-weight: 900; transition: opacity 0.3s ease; pointer-events: none; z-index: 10; }
        .time-val { font-family: 'Rajdhani', sans-serif; font-size: 18vw; line-height: 1; transition: transform 0.2s ease; text-shadow: 0 0 25px rgba(255,255,255,0.4); }

        .top { top: 5vh; left: 50%; transform: translateX(-50%) rotate(180deg); }
        .bottom { bottom: 6vh; left: 50%; transform: translateX(-50%); }
        .left { left: 8vw; top: 50%; transform: translate(-50%, -50%) rotate(90deg); }
        .right { right: 8vw; top: 50%; transform: translate(50%, -50%) rotate(-90deg); }

        .ready-active { opacity: 1 !important; }
        .paused-dim { opacity: 0.3 !important; } 

        .warning .time-val { color: var(--danger); text-shadow: 0 0 30px rgba(255,59,48,0.7); animation: pulse-warning 1s infinite; }
        @keyframes pulse-warning { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .zero-blink .time-val { animation: pulseZero 0.5s infinite; color: var(--danger); }

        .poker-table { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 80vw; max-width: 900px; aspect-ratio: 21 / 9; border: 15px solid #222; border-radius: 999px; background: radial-gradient(circle, var(--royal-blue) 0%, var(--dark-blue) 100%); box-shadow: inset 0 0 70px #000, 0 15px 40px rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; }
        .poker-table::after { content: "פווקר 2025"; position: absolute; font-family: 'Rajdhani', sans-serif; font-size: 4.5vw; font-weight: 700; color: rgba(255,255,255,0.03); letter-spacing: 12px; pointer-events: none; }
        .table-inner-line { position: absolute; inset: 15px; border: 2px solid rgba(255, 204, 0, 0.12); border-radius: 999px; pointer-events: none; }

        .player-seat { position: absolute; width: 95px; height: 95px; background: #151515; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; transform: translate(-50%, -50%); z-index: 50; transition: all 0.3s ease; box-shadow: inset 0 -4px 10px rgba(0,0,0,0.9), 0 8px 15px rgba(0,0,0,0.7); border: 2px solid #333; }
        .player-seat.in-game { border-color: var(--gold); box-shadow: inset 0 -4px 10px rgba(0,0,0,0.9), 0 0 20px rgba(255, 204, 0, 0.3); }
        .player-seat.seat-removed { opacity: 0.35; filter: grayscale(0.8); border-style: dashed; }
        .seat-name { opacity:0.95; font-weight:bold; color:white; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:75px; font-size: 15px; }
        .seat-divider { width: 65%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 4px 0; opacity: 0.6; }
        .seat-buyin { color:var(--gold); font-weight:900; font-size:18px; text-shadow: 0 0 8px rgba(255, 204, 0, 0.6); }

        .chip-icon { display: inline-flex; justify-content: center; align-items: center; width: 3.5vw; height: 3.5vw; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.3); font-weight: bold; font-size: 1.6vw; color: white; }
        .total-pot-container { text-align: center; margin-top: 78vh; }
        .total-pot-container h2 { font-family: 'Rajdhani', sans-serif; font-size: 7vw; color: var(--gold); margin: 0; font-weight: 700; text-shadow: 0 0 20px rgba(255,204,0,0.5), 0 0 40px rgba(255,204,0,0.2); }

        .page-dots { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 100; }
        .dot { width: 10px; height: 10px; background: #444; border-radius: 50%; transition: 0.3s; cursor: pointer; }
        .dot.active { background: var(--gold); width: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(255,204,0,0.5); }

        .controls { position: absolute; bottom: 30px; left: 30px; display: flex; gap: 15px; z-index: 40; }
        .btn { background: rgba(0,0,0,0.6); border: 1px solid #555; color: white; padding: 14px 24px; border-radius: 14px; font-weight: bold; font-size: 1.1em; cursor: pointer; transition: all 0.2s ease; }
        .btn:hover { background: rgba(30,30,30,0.8); }
        .btn:active { transform: scale(0.96); }

        .btn-info { position: absolute; top: 30px; left: 30px; background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 50%; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.4); color: var(--gold); font-size: 1.3em; font-weight: bold; font-family: sans-serif; z-index: 50; }
        .btn-info:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.15); }

        #rebuyModal, #endGameModal, #settingsModal, #addPlayerModal, #aboutModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10000; }
        
        .settings-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: rgba(0,0,0,0.4); padding: 12px 15px; border-radius: 15px; direction: rtl; border: 1px solid rgba(255,255,255,0.05); }
        .settings-row span { font-weight: bold; font-size: 1em; color: white; }
        .settings-row input[type="number"] { width: 80px; background: rgba(0,0,0,0.6); border: 1px solid transparent; color: white; padding: 8px; text-align: center; border-radius: 10px; font-size: 1.1em; transition: 0.3s; }
        .settings-row input[type="number"]:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 10px rgba(255,204,0,0.3); }
        
        .settings-toggle { width: 50px; height: 26px; background: #444; border-radius: 15px; position: relative; cursor: pointer; transition: background 0.3s; }
        .settings-toggle.active { background: var(--success); box-shadow: 0 0 10px rgba(52, 199, 89, 0.4); }
        .settings-toggle::after { content: ''; position: absolute; width: 22px; height: 22px; border-radius: 50%; background: white; top: 2px; left: 2px; transition: transform 0.3s; }
        .settings-toggle.active::after { transform: translateX(24px); }

        .end-game-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); direction: rtl; }
        .end-game-row span { font-weight: bold; font-size: 1.1em; color: var(--gold); }
        .end-game-row input { width: 100px; background: rgba(0,0,0,0.6); border: 1px solid transparent; color: white; padding: 8px; text-align: center; border-radius: 10px; font-size: 1.1em; transition: 0.3s; }
        .end-game-row input:focus { border-color: var(--gold); outline:none; }

        @keyframes pulseZero { 0%, 100% { transform: scale(1.1); } 50% { transform: scale(1.3); } }

        .bottom-controls-container { position: absolute; bottom: 25px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 40; direction: rtl; }
        .btn-settings { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 50%; width: 52px; height: 52px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .btn-settings:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.15); }

        .btn-timebank { background: linear-gradient(135deg, #ff3b30, #bc1e1e); color: white; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1px; border: 1px solid rgba(255, 61, 0, 0.4); padding: 12px 26px; border-radius: 30px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 20px rgba(255, 59, 48, 0.35); }
        .btn-timebank:active { transform: scale(0.95); box-shadow: 0 2px 10px rgba(255, 59, 48, 0.2); }

        @media (max-width: 768px) {
            #splashLogo { width: 220px; height: 220px; }
            .setup-card, #rebuyModal, #endGameModal, #settingsModal, #addPlayerModal, #aboutModal { width: 90%; padding: 25px 20px; }
            .setup-card input, .modal-input { width: 95%; }
            .poker-table { width: 92vw; aspect-ratio: 1.8 / 1; border-width: 10px; }
            .poker-table::after { font-size: 7vw; }
            .player-seat { width: 70px; height: 70px; }
            .seat-name { font-size: 12px; max-width: 55px; }
            .seat-buyin { font-size: 14px; }
            .time-val { font-size: 25vw; }
            .game-clock { font-size: 4.5vw; padding: 6px 14px; }
            .blind-info { padding: 4px 12px; gap: 4px; }
            .chip-icon { width: 6.5vw; height: 6.5vw; font-size: 3.2vw; }
            .total-pot-container { margin-top: 68vh; }
            .total-pot-container h2 { font-size: 15vw; }
            .controls { width: 90%; justify-content: center; left: 50%; transform: translateX(-50%); bottom: 60px; }
            .btn { padding: 10px 16px; font-size: 1em; }
            .bottom-controls-container { bottom: 35px; }
            .btn-timebank { padding: 10px 22px; font-size: 13px; }
            .btn-settings { width: 46px; height: 46px; }
            .btn-info { top: 20px; left: 20px; width: 36px; height: 36px; font-size: 1.1em; }
        }
    </style>
</head>
<body>

    <div id="toastContainer"></div>
    <div id="progressBar"></div>

    <div id="splashScreen">
        <div id="splashLogo"></div>
    </div>

    <div id="setupScreen">
        <div class="setup-card">
            <h1 style="color:var(--gold); font-size: 2.5em; margin-bottom:10px; text-shadow: 0 0 15px rgba(255,204,0,0.4);">פווקר 2025</h1>
            </div>
    </div>

<script>
    function showToast(msg, isError = false) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast';
        if(isError) {
            toast.style.borderColor = 'var(--danger)';
            toast.style.boxShadow = '0 10px 30px rgba(255,59,48,0.3)';
        }
        toast.innerText = msg;
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.style.animation = 'toastExit 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
            setTimeout(() => toast.remove(), 400);
        }, 3000);
    }

    function safeGetLocal() { try { return localStorage.getItem('pokerPendingSync'); } catch(e) { return null; } }
    function safeSetLocal(val) { try { localStorage.setItem('pokerPendingSync', val); } catch(e) {} }
    function safeRemoveLocal() { try { localStorage.removeItem('pokerPendingSync'); } catch(e) {} }

    const splash = document.getElementById('splashScreen');
    function deactivateSplash() {
        if (splash && splash.style.display !== 'none') {
            splash.style.opacity = '0';
            setTimeout(() => { splash.style.display = 'none'; }, 800);
        }
        try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    setTimeout(deactivateSplash, 3000);

    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxkx46PqRDcXpXRcKgpViKCH6bxHfVq52a2cUReFqjXh3QBdlVFwCA9yoEKtctqsPAIsA/exec';
    const fixedFriends = ["מתן", "רועי", "שחר", "דור", "רדיון", "טום", "בן", "תום", "טל"];
    let selectedFriends = [];
    let players = [], totalPot = 0, currentLevelIdx = 0, currentPage = 0;
    let timeLeft = 30, defaultRoundTime = 30, isActionRunning = false, timerId = null, gameClockId = null;
    let startX = 0, lastTap = 0, audioCtx = null, selIdx = -1, startTimeStr = '';
    let wakeLock = null;
    let isMuted = false; 
    let gameSecondsElapsed = 0;
    
    const levels = [{s:1,b:2},{s:2,b:4},{s:5,b:10},{s:10,b:20},{s:20,b:40},{s:50,b:100}];
    const chipColors = { 1: '#999', 2: '#1e88e5', 5: '#e53935', 10: '#43a047', 20: '#8e24aa', 50: '#fb8c00', 100: '#111' };
    
    window.addEventListener('load', () => {
        runLocalStorageSyncCheck();
    });

    function runLocalStorageSyncCheck(isManual = false) {
        const pendingData = safeGetLocal();
        if (pendingData) {
            if (isManual || confirm('זוהו נתוני משחק קודם שלא נשלחו. לנסות לשלוח אותם עכשיו?')) {
                fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: pendingData
                })
                .then(() => { showToast('הנתונים נשלחו בהצלחה לגוגל שיטס!'); safeRemoveLocal(); })
                .catch(err => { showToast('בעיית רשת: עדיין לא ניתן לסנכרן.', true); });
            }
        } else if (isManual) {
            showToast('כל הנתונים מסונכרנים! אין מידע ממתין.');
        }
    }

    async function requestWakeLock() {
        try { 
            if ('wakeLock' in navigator) { 
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => {});
            } 
        } catch (err) {}
    }

    document.addEventListener('visibilitychange', async () => {
        const wlToggle = document.getElementById('wakeLockToggle');
        if (wakeLock !== null && document.visibilityState === 'visible' && wlToggle && wlToggle.classList.contains('active')) { 
            await requestWakeLock(); 
        }
    });

    function buildFriendsGrid() {
        const grid = document.getElementById('friendsGrid');
        if(!grid) return;
        grid.innerHTML = '';
        fixedFriends.forEach(name => {
            const el = document.createElement('div');
            el.className = 'friend-circle';
            el.innerHTML = `<span>${name}</span><div class="v-badge">&#10003;</div>`;
            el.onclick = () => toggleFriend(name, el);
            grid.appendChild(el);
        });
    }

    function toggleFriend(name, el) {
        if(selectedFriends.includes(name)) {
            selectedFriends = selectedFriends.filter(f => f !== name);
            el.classList.remove('selected');
        } else {
            selectedFriends.push(name);
            el.classList.add('selected');
        }
        document.getElementById('activeCountDisplay').innerText = selectedFriends.length;
    }
    buildFriendsGrid();

    function playSound(f, d, type = 'sine') {
        if (isMuted) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = type; o.connect(g); g.connect(audioCtx.destination);
            o.frequency.value = f;
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            o.start(); o.stop(audioCtx.currentTime + d);
        } catch(e) {}
    }

    function startGame() {
        if(selectedFriends.length === 0) { showToast("חובה לבחור שחקן אחד לפחות!", true); return; }
        requestWakeLock();
        try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
        const b = +document.getElementById('initialBuyin').value;
        defaultRoundTime = +document.getElementById('roundTimeInput').value || 30;
        timeLeft = defaultRoundTime;
        
        const now = new Date();
        startTimeStr = now.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'});
        
        players = []; totalPot = 0; gameSecondsElapsed = 0;
        selectedFriends.forEach((name, i) => { 
            players.push({ id: i+1, name: name, in: b, joinTime: startTimeStr, leaveTime: 'עדין במשחק', removed: false }); 
            totalPot += b; 
        });

        const setupScreen = document.getElementById('setupScreen');
        document.getElementById('slider').style.display = 'flex';
        setupScreen.style.opacity = '0';
        setTimeout(() => { setupScreen.style.display = 'none'; }, 500);

        render(); updateUI();
    }

    document.addEventListener('touchstart', e => {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        startX = e.touches[0].clientX;
    }, {passive: true});

    document.addEventListener('touchend', e => {
        const splashScreenObj = document.getElementById('splashScreen');
        if(e.target.closest('.btn') || e.target.closest('.btn-info') || e.target.closest('.player-seat') || e.target.closest('#rebuyModal') || e.target.closest('#addPlayerModal') || e.target.closest('#endGameModal') || e.target.closest('#settingsModal') || e.target.closest('#aboutModal') || e.target.closest('.blind-arrow-btn') || e.target.closest('.btn-settings') || e.target.closest('.btn-timebank') || (splashScreenObj && splashScreenObj.style.display !== 'none')) return;
        const diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 60) {
            currentPage = diff > 0 ? 1 : 0;
            updatePageSlider();
        }
    });

    function updatePageSlider() {
        document.getElementById('slider').style.transform = `translateX(-${currentPage * 100}vw)`;
        document.getElementById('dot0').classList.toggle('active', currentPage === 0);
        document.getElementById('dot1').classList.toggle('active', currentPage === 1);
    }

    document.getElementById('dot0').onclick = () => { currentPage = 0; updatePageSlider(); };
    document.getElementById('dot1').onclick = () => { currentPage = 1; updatePageSlider(); };

    document.body.addEventListener('pointerdown', e => {
        const splashScreenObj = document.getElementById('splashScreen');
        if(currentPage === 1 || (splashScreenObj && splashScreenObj.style.display !== 'none')) return;
        if(e.target.closest('.btn') || e.target.closest('.btn-info') || e.target.closest('#rebuyModal') || e.target.closest('#addPlayerModal') || e.target.closest('#setupScreen') || e.target.closest('#endGameModal') || e.target.closest('#settingsModal') || e.target.closest('#aboutModal') || e.target.closest('.page-dots') || e.target.closest('.blind-arrow-btn') || e.target.closest('.btn-settings') || e.target.closest('.btn-timebank')) return;
        
        if(!gameClockId) startClock();
        const now = Date.now();
        
        if(now - lastTap < 300) { 
            clearInterval(timerId); isActionRunning = false; timeLeft = defaultRoundTime; 
        } else {
            if(isActionRunning) { 
                clearInterval(timerId); isActionRunning = false; 
            } else {
                if(timeLeft === 0) timeLeft = defaultRoundTime;
                isActionRunning = true;
                timerId = setInterval(() => {
                    if(timeLeft > 0) {
                        timeLeft--;
                        if(timeLeft === 10) playSound(523, 0.1, 'sine');
                        if(timeLeft <= 5 && timeLeft > 0) playSound(659, 0.05, 'sine');
                        if(timeLeft === 0) playSound(330, 0.7, 'triangle');
                    } else {
                        clearInterval(timerId);
                        isActionRunning = false;
                    }
                    updateUI();
                }, 1000);
            }
        }
        lastTap = now;
        updateUI();
    });

    function startClock() {
        if(gameClockId) clearInterval(gameClockId);
        gameClockId = setInterval(() => {
            gameSecondsElapsed++;
            const h = Math.floor(gameSecondsElapsed/3600).toString().padStart(2,'0');
            const m = Math.floor((gameSecondsElapsed%3600)/60).toString().padStart(2,'0');
            const s = (gameSecondsElapsed%60).toString().padStart(2,'0');
            document.getElementById('gameClock').innerText = `${h}:${m}:${s}`;
        }, 1000);
    }

    function render() {
        const container = document.getElementById('seatsContainer');
        const line = container.querySelector('.table-inner-line');
        container.innerHTML = '';
        if(line) container.appendChild(line);
        else {
            const newLine = document.createElement('div');
            newLine.className = 'table-inner-line';
            container.appendChild(newLine);
        }
        
        const activePlayers = players.filter(p => !p.removed);
        activePlayers.forEach((p, i) => {
            const angle = (i / activePlayers.length) * Math.PI * 2 + Math.PI/2;
            const x = 50 + 46 * Math.cos(angle), y = 50 + 46 * Math.sin(angle);
            const seat = document.createElement('div');
            seat.className = p.removed ? 'player-seat seat-removed' : 'player-seat in-game';
            seat.style.left = x+'%'; seat.style.top = y+'%';
            
            const displayName = p.name ? p.name : `#${p.id}`;
            seat.innerHTML = `<span class="seat-name">${displayName}</span><div class="seat-divider"></div><span class="seat-buyin">${p.in}</span>`;
            
            const origIdx = players.indexOf(p);
            seat.onclick = (e) => { e.stopPropagation(); openRebuy(origIdx); };
            container.appendChild(seat);
        });
        
        const lvl = levels[currentLevelIdx];
        document.getElementById('blindDisplay').innerHTML = `<div class="chip-icon" style="background:${chipColors[lvl.s]||'#444'}">${lvl.s}</div><span style="color:#bbb; font-weight:bold; font-size:1.2em; text-shadow:0 0 5px rgba(255,255,255,0.4);">/</span><div class="chip-icon" style="background:${chipColors[lvl.b]||'#222'}">${lvl.b}</div>`;
    }

    function updateUI() {
        document.getElementById('potDisplay').innerText = totalPot;
        document.querySelectorAll('.timer').forEach(el => {
            const valEl = el.querySelector('.time-val');
            valEl.innerText = timeLeft;
            el.classList.remove('ready-active', 'paused-dim', 'warning', 'zero-blink');
            
            if (isActionRunning || timeLeft === defaultRoundTime) el.classList.add('ready-active');
            else el.classList.add('paused-dim');
            
            if (timeLeft <= 10 && timeLeft > 0) el.classList.add('warning');
            if (timeLeft === 0) el.classList.add('zero-blink');
        });

        const percent = (timeLeft / defaultRoundTime) * 100;
        const progressEl = document.getElementById('progressBar');
        if (progressEl) {
            progressEl.style.width = percent + '%';
            if (timeLeft <= 5) {
                progressEl.style.background = 'var(--danger)';
                progressEl.style.boxShadow = '0 0 10px var(--danger)';
            } else {
                progressEl.style.background = 'var(--gold)';
                progressEl.style.boxShadow = '0 0 10px var(--gold)';
            }
        }
    }

    function addTime(e) { e.stopPropagation(); timeLeft += defaultRoundTime; updateUI(); }
    
    function changeBlindLevel(e, direction) {
        e.stopPropagation();
        let newIndex = currentLevelIdx + direction;
        if(newIndex >= 0 && newIndex < levels.length) {
            currentLevelIdx = newIndex;
            render();
        }
    }
    
    function openRebuy(i) { 
        selIdx = i;
        document.getElementById('rebuyTitle').innerText = players[i].name; 
        document.getElementById('playerNameInput').value = players[i].name; 
        document.getElementById('rebuyAmount').value = 50; 
        document.getElementById('rebuyModal').style.display = 'block';
    }
    function closeRebuy() { document.getElementById('rebuyModal').style.display = 'none'; }
    
    document.getElementById('confirmBtn').onclick = () => { 
        players[selIdx].name = document.getElementById('playerNameInput').value;
        const addAmount = +document.getElementById('rebuyAmount').value; 
        if(addAmount > 0) { players[selIdx].in += addAmount; totalPot += addAmount; } 
        render(); closeRebuy(); updateUI(); 
    };

    document.getElementById('removeBtn').onclick = () => { 
        const now = new Date();
        players[selIdx].leaveTime = now.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'});
        players[selIdx].removed = true;
        render(); closeRebuy(); updateUI(); 
    };

    function openSettings(e) {
        e.stopPropagation();
        document.getElementById('liveRoundTimeInput').value = defaultRoundTime;
        document.getElementById('settingsModal').style.display = 'block';
    }
    
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
    function toggleMute() { isMuted = !isMuted; document.getElementById('muteToggle').classList.toggle('active', isMuted); }

    function openAbout(e) { e.stopPropagation(); document.getElementById('aboutModal').style.display = 'block'; }
    function closeAbout() { document.getElementById('aboutModal').style.display = 'none'; }
    
    function updateLiveRoundTime(val) {
        const parsed = parseInt(val);
        if(parsed > 0) {
            defaultRoundTime = parsed;
            if(!isActionRunning && timeLeft > defaultRoundTime) {
                timeLeft = defaultRoundTime;
                updateUI();
            }
        }
    }
    
    function forceSyncData() { runLocalStorageSyncCheck(true); }
    
    async function toggleWakeLockLive() {
        const wlToggle = document.getElementById('wakeLockToggle');
        const isActive = wlToggle.classList.contains('active');
        
        if(isActive) {
            wlToggle.classList.remove('active');
            if(wakeLock) { try { await wakeLock.release(); wakeLock = null; } catch(e){} }
        } else {
            wlToggle.classList.add('active');
            await requestWakeLock();
        }
    }

    function openAddPlayerModal() {
        closeSettings();
        document.getElementById('newPlayerNameInput').value = '';
        document.getElementById('addPlayerModal').style.display = 'block';
    }

    function confirmAddLatePlayer() {
        const name = document.getElementById('newPlayerNameInput').value;
        if (!name || name.trim() === "") {
            showToast("נא להזין שם שחקן", true);
            return;
        }
        
        const currentBuyin = +document.getElementById('initialBuyin').value || 50;
        const now = new Date();
        const joinTimeStr = now.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'});
        
        const newId = players.length + 1;
        players.push({
            id: newId,
            name: name.trim(),
            in: currentBuyin,
            joinTime: joinTimeStr,
            leaveTime: 'עדין במשחק',
            removed: false
        });
        
        totalPot += currentBuyin;
        document.getElementById('addPlayerModal').style.display = 'none';
        render(); updateUI();
        showToast(`השחקן ${name.trim()} הוסף עם ${currentBuyin}!`);
    }

    function resetGameToSetup() {
        if (!confirm("האם אתה בטוח שברצונך לאפס את כל המשחק הנוכחי ולחזור למסך ההגדרות?")) return;
        clearInterval(timerId); clearInterval(gameClockId);
        isActionRunning = false; timerId = null; gameClockId = null; gameSecondsElapsed = 0;
        
        players = []; totalPot = 0; currentLevelIdx = 0; currentPage = 0; selectedFriends = [];

        document.getElementById('gameClock').innerText = "00:00:00";
        document.getElementById('activeCountDisplay').innerText = "0";
        buildFriendsGrid(); updatePageSlider();
        
        document.getElementById('slider').style.display = 'none';
        const setupScreen = document.getElementById('setupScreen');
        setupScreen.style.display = 'flex'; setupScreen.style.opacity = '1';
        
        closeSettings();
    }

    function openEndGame(e) {
        e.stopPropagation();
        clearInterval(timerId); isActionRunning = false; updateUI();
        document.getElementById('endGameTotalBank').innerText = totalPot;
        const container = document.getElementById('endGamePlayersContainer');
        container.innerHTML = '';
        players.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'end-game-row';
            div.innerHTML = `
                <span>${p.name} (השקיע: ${p.in})</span>
                <input type="number" class="end-game-out-input" data-idx="${i}" value="0" oninput="calculateDistribution()">
            `;
             container.appendChild(div);
        });
        calculateDistribution();
        document.getElementById('endGameModal').style.display = 'block';
    }
    
    function closeEndGame() { document.getElementById('endGameModal').style.display = 'none'; }

    function calculateDistribution() {
        const inputs = document.querySelectorAll('.end-game-out-input');
        let totalOut = 0;
        inputs.forEach(input => { totalOut += +input.value || 0; });
        document.getElementById('endGameDistributed').innerText = totalOut;

        if(totalOut === totalPot) {
            document.getElementById('endGameDistributed').style.color = 'var(--success)';
            document.getElementById('endGameDistributed').style.textShadow = '0 0 10px rgba(52,199,89,0.5)';
            document.getElementById('validationMessage').style.display = 'none';
        } else {
            document.getElementById('endGameDistributed').style.color = 'var(--danger)';
            document.getElementById('endGameDistributed').style.textShadow = 'none';
        }
    }

    function submitGameHistory() {
        const inputs = document.querySelectorAll('.end-game-out-input');
        let totalOut = 0;
        inputs.forEach(input => { totalOut += +input.value || 0; });
        if (totalOut !== totalPot) {
            document.getElementById('validationMessage').style.display = 'block';
            return;
        }

        const submitBtn = document.getElementById('finishAndSendBtn');
        submitBtn.innerText = "⏳ מסנכרן נתונים לאקסל...";
        submitBtn.style.opacity = "0.5"; 
        submitBtn.style.pointerEvents = "none"; 

        const endOfGameTime = new Date().toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'});
        const gameData = {
            startTime: startTimeStr,
            endTime: endOfGameTime,
            players: players.map((p, idx) => {
                const outVal = +document.querySelector(`.end-game-out-input[data-idx="${idx}"]`).value || 0;
                const finalLeaveTime = p.removed ? p.leaveTime : endOfGameTime;
                
                return { 
                    name: p.name, 
                    buyin: p.in, 
                    cashout: outVal, 
                    profit: outVal - p.in, 
                    joinTime: p.joinTime, 
                    leaveTime: finalLeaveTime 
                };
            })
        };
        const stringified = JSON.stringify(gameData);
        safeSetLocal(stringified);

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: stringified
        })
        .then(() => {
            showToast('המשחק הסתיים והנתונים נשמרו בהצלחה!');
            safeRemoveLocal();
            setTimeout(() => location.reload(), 2500); 
        })
        .catch(err => {
            showToast('בעיית רשת: הנתונים נשמרו במכשיר, ויסונכרנו בהמשך.', true);
            setTimeout(() => location.reload(), 3000);
        });
    }
    </script>
</body>
</html>
